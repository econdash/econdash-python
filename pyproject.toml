[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "econdash"
dynamic = ["version"]
description = "Python client for the EconDash macroeconomic data API: 750+ indicators, 290+ countries, sources and licences."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "EconDash", email = "noderguru@gmail.com" }]
keywords = ["economics", "macroeconomics", "gdp", "inflation", "time-series", "api", "x402", "world-bank", "imf"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.5",
]

[project.optional-dependencies]
x402 = ["x402[evm]>=2.25,<3"]

[project.urls]
Homepage = "https://econdash.org"
Documentation = "https://econdash.org/docs/python"
Repository = "https://github.com/econdash/econdash-python"
Issues = "https://github.com/econdash/econdash-python/issues"
Changelog = "https://github.com/econdash/econdash-python/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.hatch.version]
path = "src/econdash/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "CHANGELOG.md", "LICENSE", "CITATION.cff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: hits the real EconDash API (run with -m live)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
strict = true
packages = ["econdash"]

[[tool.mypy.overrides]]
module = ["x402", "x402.*"]
ignore_missing_imports = true
