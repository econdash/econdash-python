[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-econdash"
version = "0.1.1"
description = "LangChain tools for EconDash macroeconomic data. Same free trial, API key and pay-per-call rules as the econdash client."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "EconDash", email = "noderguru@gmail.com" }]
keywords = ["langchain", "econdash", "economics", "tools", "x402"]
dependencies = [
    "econdash>=0.2.1",
    "langchain-core>=0.3",
    "pydantic>=2.5",
]

[project.urls]
Homepage = "https://econdash.org"
Repository = "https://github.com/econdash/econdash-python"
Documentation = "https://econdash.org/docs/python"

[tool.hatch.build.targets.wheel]
packages = ["src/langchain_econdash"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "examples"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: hits the real EconDash API (run with -m live)"]
addopts = "-m 'not live'"
