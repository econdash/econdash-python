name: Publish to PyPI

# PyPI trusted publishing: no API token is stored anywhere.
# PyPI side: project econdash, owner econdash, repo econdash-python,
# workflow publish.yml, environment pypi.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
      - run: uv sync --all-extras --locked
      - run: uv run pytest
      - name: Tag matches package version
        run: test "${GITHUB_REF_NAME#v}" = "$(uv run python -c 'import econdash; print(econdash.__version__)')"
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/econdash/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
